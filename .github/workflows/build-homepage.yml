name: Build Homepage Image

on:
  schedule:
    - cron: '0 7 * * 0'
  workflow_dispatch:

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  SOURCE_REPO: "https://codeberg.org/thelinuxcast/Homepage.git"

jobs:
  build-homepage:
    name: Build and push homepage
    runs-on: ubuntu-26.04

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Setup runner
        uses: projectbluefin/actions/bootc-build/setup-runner@f862ab6946fb10e5566bfda8336fd58cedb3b9c3 # v1
        with:
          storage-backend: remove-software
          update-podman: false
          install-tools: '["just", "cosign"]'

      - name: Clone Homepage Source
        run: |
          set -euo pipefail
          git clone "${SOURCE_REPO}" /tmp/homepage
          cd /tmp/homepage
          SOURCE_SHA=$(git rev-parse --short HEAD)
          echo "source_sha=${SOURCE_SHA}" >> "$GITHUB_ENV"
          echo "SOURCE_SHA=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build Image
        id: build-image
        run: |
          set -euo pipefail
          cd /tmp/homepage
          sudo -E podman build -t "homepage:latest" .

      - name: Generate Build Tags
        id: gen-build-tags
        run: |
          DATE=$(date +%Y%m%d)
          BUILD_TAGS=()
          BUILD_TAGS+=("${source_sha}")
          BUILD_TAGS+=("${DATE}-${source_sha}")
          BUILD_TAGS+=("${DATE}")
          BUILD_TAGS+=("latest")
          echo "${BUILD_TAGS[*]}"
          echo "alias_tags=${BUILD_TAGS[*]}" >> "$GITHUB_OUTPUT"

      - name: Tag Image
        id: tag-images
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          set -euo pipefail

          IMAGE_ID=$(sudo -E podman images --filter reference="homepage:latest" --format '{{.ID}}' | head -n1)
          sudo -E podman tag "${IMAGE_ID}" "homepage:${source_sha}"

          for tag in ${ALIAS_TAGS}; do
            if [[ "${tag}" != "${source_sha}" ]]; then
              sudo -E podman tag "${IMAGE_ID}" "homepage:${tag}"
            fi
          done

          sudo -E podman images

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push To GHCR
        id: push-image
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          set -euox pipefail

          REGISTRY="${IMAGE_REGISTRY,,}"

          for tag in ${ALIAS_TAGS}; do
            sudo -E podman push \
              --digestfile=/tmp/digestfile \
              "homepage:${tag}" \
              "${REGISTRY}/homepage:${tag}"
          done

          digest="$(< /tmp/digestfile)"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign container image
        if: github.event_name != 'pull_request'
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          cosign sign -y \
            --new-bundle-format=false \
            --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY \
            "${IMAGE_REGISTRY,,}/homepage@${DIGEST}"
