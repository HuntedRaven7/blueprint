---
name: Promote main to stable

# Two-branch model: `main` is the testing branch (publishes :testing),
# `stable` is the production branch (publishes :stable). On every push to
# `main` the shared factory workflow opens (or refreshes) a squash promotion
# PR from `main` to `stable`; merging it publishes :stable.
#
# Reusable logic lives in projectbluefin/actions — this is a thin caller.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  issues: write
  packages: read
  pull-requests: write
  statuses: write

concurrency:
  group: promote-main-to-stable
  cancel-in-progress: false

jobs:
  promote:
    name: Promote main to stable
    uses: projectbluefin/actions/.github/workflows/reusable-promote-squash.yml@837850b6100b22c7920476035e7e1c28fdbba67f # v1
    with:
      variants: >-
        [
          {"image":"arch-bootc"},
          {"image":"debian-bootc"},
          {"image":"nixos-bootc"},
          {"image":"opensuse-bootc"},
          {"image":"ubuntu-bootc"}
        ]
      cosign_identity_regexp: >-
        ^https://github\.com/${{ github.repository_owner }}/[^/]+/\.github/workflows/
      registry: ghcr.io/${{ github.repository_owner }}
      source_branch: main
      target_branch: stable
      run_e2e: false
    secrets: inherit
