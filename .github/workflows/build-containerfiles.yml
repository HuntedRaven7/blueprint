---
name: Build and Push Containerfiles

on:
  push:
    branches:
      - main
      - stable
    paths-ignore:
      - "**.md"
      - ".github/workflows/*validate*.yml"
  workflow_dispatch:

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  PRODUCTION_BRANCH: "stable"
  REGISTRY_CACHE_WRITE: ${{ github.event_name != 'pull_request' && '1' || '0' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        variant: [server, aira, ai]

    steps:
      - name: Prepare environment
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> "${GITHUB_ENV}"

      - name: Determine image tag
        id: determine-tag
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "${REF_NAME}" != "${PRODUCTION_BRANCH}" ]]; then
            echo "TAG_STREAM=testing" >> "${GITHUB_ENV}"
            echo "Building testing image for: ${{ matrix.variant }}"
          else
            echo "TAG_STREAM=stable" >> "${GITHUB_ENV}"
            echo "Building stable image for: ${{ matrix.variant }}"
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Setup runner
        uses: projectbluefin/actions/bootc-build/setup-runner@eb4c546389f19ad9e42f1af052623de73c620ebb # v1
        with:
          storage-backend: remove-software
          update-podman: true
          install-tools: '["just", "cosign"]'

      - name: Detect changes
        id: detect-changes
        uses: projectbluefin/actions/bootc-build/detect-changes@eb4c546389f19ad9e42f1af052623de73c620ebb # v1
        with:
          filters: |
            image:
              - 'Justfile'
              - 'containerfiles/**'

      - name: Resolve variant identity
        id: variant
        env:
          TARGET_IMAGE: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source <(just variant-env "${TARGET_IMAGE}")
          echo "IMAGE_NAME=${IMAGE_NAME}" >> "${GITHUB_OUTPUT}"
          echo "DEFAULT_TAG=${DEFAULT_TAG}" >> "${GITHUB_OUTPUT}"
          echo "IMAGE_NAME=${IMAGE_NAME}" >> "${GITHUB_ENV}"
          echo "DEFAULT_TAG=${DEFAULT_TAG}" >> "${GITHUB_ENV}"

      - name: Preflight
        id: preflight
        uses: projectbluefin/actions/bootc-build/preflight@eb4c546389f19ad9e42f1af052623de73c620ebb # v1
        with:
          registry: ghcr.io
          github-token: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.IMAGE_NAME }}

      - name: Build image
        id: build-image
        if: steps.detect-changes.outputs.should_build == 'true' || github.event_name != 'pull_request'
        env:
          TARGET_IMAGE: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          sudo -E "$(command -v just)" build-containerfile "${TARGET_IMAGE}" "${DEFAULT_TAG}"

      - name: Rechunk with Chunkah
        if: matrix.variant != 'ai' && (steps.detect-changes.outputs.should_build == 'true' || github.event_name != 'pull_request')
        id: rechunk
        run: |
          sudo -E "$(command -v just)" rechunk \
            "${IMAGE_NAME}" \
            "${DEFAULT_TAG}"

      - name: Generate Build Tags
        id: gen-build-tags
        if: steps.detect-changes.outputs.should_build == 'true' || github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          DATE=$(date +%Y%m%d)
          BUILD_TAGS=()
          if [[ -z "$(git status -s)" ]]; then
            GIT_SHA=$(git rev-parse --short HEAD)
            BUILD_TAGS+=("${TAG_STREAM}-${GIT_SHA}")
            BUILD_TAGS+=("${TAG_STREAM}-${DATE}-${GIT_SHA}")
          fi
          BUILD_TAGS+=("${TAG_STREAM}-${DATE}")
          BUILD_TAGS+=("${TAG_STREAM}")
          echo "${BUILD_TAGS[*]}"
          echo "alias_tags=${BUILD_TAGS[*]}" >> "$GITHUB_OUTPUT"

      - name: Tag Image
        id: tag-images
        if: steps.detect-changes.outputs.should_build == 'true' || github.event_name != 'pull_request'
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          set -euo pipefail

          IMAGE_ID=$(sudo -E podman images --filter reference="${IMAGE_NAME}:${DEFAULT_TAG}" --format '{{.ID}}' | head -n1)
          sudo -E podman tag "${IMAGE_ID}" "${IMAGE_NAME}:${DEFAULT_TAG}"

          for tag in ${ALIAS_TAGS}; do
            if [[ "${tag}" != "${DEFAULT_TAG}" ]]; then
              sudo -E podman tag "${IMAGE_ID}" "${IMAGE_NAME}:${tag}"
            fi
          done

          sudo -E podman images

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push To GHCR
        if: steps.detect-changes.outputs.should_build == 'true' || github.event_name != 'pull_request'
        id: push-image
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        uses: projectbluefin/actions/bootc-build/push-image@eb4c546389f19ad9e42f1af052623de73c620ebb # v1
        with:
          image-name: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.gen-build-tags.outputs.alias_tags }}
          default-tag: ${{ env.DEFAULT_TAG }}
          registry: ghcr.io
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign container image
        if: steps.detect-changes.outputs.should_build == 'true' || github.event_name != 'pull_request'
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          cosign sign -y \
            --new-bundle-format=false \
            --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      - name: Build telemetry summary
        if: always() && !cancelled() && (steps.detect-changes.outputs.should_build == 'true' || github.event_name != 'pull_request')
        shell: bash
        run: |
          IMAGE_SIZE=$(sudo podman image inspect "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" \
            --format '{{.Size}}' 2>/dev/null || echo "0")
          IMAGE_SIZE_MB=$(( IMAGE_SIZE / 1024 / 1024 ))
          LAYER_COUNT=$(sudo podman image inspect "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" \
            --format '{{len .RootFS.Layers}}' 2>/dev/null || echo "?")

          {
            echo "## Build Telemetry: ${{ matrix.variant }}"
            echo ""
            echo "**Image:** ${IMAGE_NAME}:${DEFAULT_TAG}"
            echo "**Image size (uncompressed):** ${IMAGE_SIZE_MB} MB"
            echo "**Layer count:** ${LAYER_COUNT}"
          } >> "$GITHUB_STEP_SUMMARY"
